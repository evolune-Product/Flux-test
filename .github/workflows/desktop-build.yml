name: Build Desktop Apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon (arm64)
            artifact: Flasqo-mac-arm64
          - os: macos-13          # Intel (x64)
            artifact: Flasqo-mac-x64
          - os: windows-latest
            artifact: Flasqo-windows-x64
          - os: ubuntu-latest
            artifact: Flasqo-linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. Build the frontend in desktop/local mode
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_LOCAL_MODE: '1'
          VITE_API_BASE_URL: http://127.0.0.1:8765
        run: |
          npm ci
          npx vite build

      # 2. Bundle the Python backend as a sidecar
      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements-desktop.txt pyinstaller

      - name: Copy frontend into backend static dir
        shell: bash
        run: |
          rm -rf backend/static
          cp -R frontend/dist backend/static

      - name: Build backend sidecar (PyInstaller)
        working-directory: backend
        run: pyinstaller flasqo-backend.spec --noconfirm

      # 3. Package the Electron app (dmg / nsis exe)
      - name: Build Electron app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.zip
          if-no-files-found: error
